# use original interface name as name; we use a dedicated `mocks` package to make the context clear
structname: "{{.InterfaceName}}"
# place all mocks in the mocks package (with-expecter is always enabled in v3)
pkgname: "mocks"
# snake case file names, one mock per file
filename: "{{ .InterfaceName | snakecase }}.go"
# all mocks should live near their interfaces
dir: "{{.InterfaceDirRelative}}/mocks"
template: testify
template-data:
  # keep the v2 default explicit
  unroll-variadic: true

# mocks to generate
packages:
  "flamingo.me/form/domain":
    config:
      all: true
      recursive: true
  "flamingo.me/form/application":
    config:
      all: true
      recursive: true
  "github.com/go-playground/validator/v10":
    config:
      dir: "domain/mocks"
    interfaces:
      FieldLevel:
      StructLevel:
      FieldError:
